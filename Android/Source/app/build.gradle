plugins { id 'com.android.application' }
android {
 namespace 'com.amplayer.portable'
 compileSdk 37
 defaultConfig { applicationId 'com.amplayer.portable'; minSdk 26; targetSdk 37; versionCode 20125; versionName '1.0.13'; testInstrumentationRunner 'com.amplayer.portable.SmokeInstrumentation' }
 def releaseKeyPath = providers.environmentVariable('JAMPLAYER_KEYSTORE_PATH').getOrElse('')
 signingConfigs {
  if (releaseKeyPath) {
   release {
    storeFile file(releaseKeyPath)
    storePassword providers.environmentVariable('AMPLAYER_STORE_PASSWORD').getOrElse('')
    keyAlias providers.environmentVariable('JAMPLAYER_KEY_ALIAS').getOrElse('amplayer')
    keyPassword providers.environmentVariable('AMPLAYER_KEY_PASSWORD').getOrElse('')
   }
  }
 }
 buildTypes { release { if (releaseKeyPath) signingConfig signingConfigs.release; minifyEnabled false } }
 compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
}

dependencies {
 implementation "androidx.annotation:annotation-experimental:1.3.1"
 implementation "androidx.media3:media3-exoplayer:1.11.1"
 implementation "androidx.media3:media3-exoplayer-hls:1.11.1"
}
